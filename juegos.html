<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Juegos Online</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: #1a1c23;
            --text-color: #e2e2e2;
            --accent-color: #ff4655;
            --hover-color: #ff5e6a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 40px;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            border-bottom: 3px solid var(--accent-color);
            padding-bottom: 10px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(255, 70, 85, 0.2);
        }

        .game-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .cover-container {
            width: 100%;
            height: 340px;
            overflow: hidden;
            position: relative;
            background-color: #2a2d39;
        }

        .cover-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            transition: transform 0.5s ease;
        }

        .game-card:hover .cover-container img {
            transform: scale(1.05);
        }

        .game-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .game-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
        }

        .play-btn {
            background-color: var(--accent-color);
            color: white;
            text-align: center;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.2s ease;
        }

        .game-card:hover .play-btn {
            background-color: var(--hover-color);
        }
    </style>
</head>
<body>

    <h1>Juegos Online</h1>

    <div class="grid-container">
        
        <!-- NFS Underground -->
        <div class="game-card">
            <a href="https://nfsu.yurasm.com/" target="_blank" class="game-link">
                <div class="cover-container">
                    <img src="https://m.media-amazon.com/images/M/MV5BNThlMTc1Y2EtY2IwYS00YzdhLWJjNjItOTk1MGU4OWFlNDFiXkEyXkFqcGc@._V1_FMjpg_UX960_.jpg" 
                         alt="NFS Underground" 
                         onerror="this.src='https://placehold.co/300x420/0a192f/64ffda?text=NFS+Underground'">
                </div>
                <div class="game-info">
                    <h2 class="game-title">NFS Underground</h2>
                    <span class="play-btn">Jugar Ahora</span>
                </div>
            </a>
        </div>

        <!-- NFS Underground 2 -->
        <div class="game-card">
            <a href="https://nfsu2.xyz/" target="_blank" class="game-link">
                <div class="cover-container">
                    <img src="https://m.media-amazon.com/images/M/MV5BM2ZiNTk2NTYtZDJmNy00MGFiLTljYWQtNGRjY2VkZWE1NDk2XkEyXkFqcGc@._V1_FMjpg_UX960_.jpg" 
                         alt="NFS Underground 2" 
                         onerror="this.src='https://placehold.co/300x420/0f291e/4ade80?text=NFS+Underground+2'">
                </div>
                <div class="game-info">
                    <h2 class="game-title">NFS Underground 2</h2>
                    <span class="play-btn">Jugar Ahora</span>
                </div>
            </a>
        </div>

        <!-- NFS Most Wanted Online -->
        <div class="game-card">
            <a href="https://nfsmwo.com/es" target="_blank" class="game-link">
                <div class="cover-container">
                    <img src="https://m.media-amazon.com/images/M/MV5BYzZlMjBjYjItMzUzOC00YTJlLThiNWQtNjViZjc1MTA2ZGE1XkEyXkFqcGc@._V1_FMjpg_UX600_.jpg" 
                         alt="NFS Most Wanted" 
                         onerror="this.src='https://placehold.co/300x420/2b2200/facc15?text=NFS+Most+Wanted'">
                </div>
                <div class="game-info">
                    <h2 class="game-title">NFS Most Wanted Online</h2>
                    <span class="play-btn">Jugar Ahora</span>
                </div>
            </a>
        </div>

        <!-- NFS Carbon -->
        <div class="game-card">
            <a href="https://nfscrb.xyz/" target="_blank" class="game-link">
                <div class="cover-container">
                    <!-- URL actualizada para NFS Carbon -->
                    <img src="https://m.media-amazon.com/images/M/MV5BZWVmNDQ3MDktZWZjNC00ODc5LWJkYmUtMDcyN2Q4NDc1NmI3XkEyXkFqcGc@._V1_FMjpg_UX600_.jpg" 
                         alt="NFS Carbon" 
                         onerror="this.src='https://placehold.co/300x420/00131a/06b6d4?text=NFS+Carbon'">
                </div>
                <div class="game-info">
                    <h2 class="game-title">NFS Carbon</h2>
                    <span class="play-btn">Jugar Ahora</span>
                </div>
            </a>
        </div>

        <!-- OpenSmash-Ultimate -->
        <div class="game-card">
            <a href="https://denkishi.github.io/opensmash-site/" target="_blank" class="game-link">
                <div class="cover-container">
                    <img src="https://upload.wikimedia.org/wikipedia/en/5/50/Super_Smash_Bros._Ultimate.jpg" 
                         alt="OpenSmash Ultimate" 
                         onerror="this.src='https://placehold.co/300x420/2a2d39/e2e2e2?text=OpenSmash+Ultimate'">
                </div>
                <div class="game-info">
                    <h2 class="game-title">OpenSmash-Ultimate</h2>
                    <span class="play-btn">Jugar Ahora</span>
                </div>
            </a>
        </div>

    </div>

</body>
</html>
